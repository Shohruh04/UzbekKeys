name: Build UzbekKeys
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native keyboards and installers
        shell: pwsh
        run: ./scripts/Build.ps1 -Bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: UzbekKeys-Windows
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/SHA256SUMS.txt
